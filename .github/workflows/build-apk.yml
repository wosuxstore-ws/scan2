name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:          # also lets you press "Run workflow" by hand

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The runner already has the Android SDK. Just accept the licenses and make sure the
      # platform this app builds against is there. (The old setup-android step failed because
      # it tried to install a package called "tools" that no longer exists.)
      - name: Android SDK packages
        run: |
          SDKM="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          # Optional: add a repository secret with this name to keep the key out of the code.
          QR_SECRET_KEY_HEX: ${{ secrets.QR_SECRET_KEY_HEX }}

      - uses: actions/upload-artifact@v4
        with:
          name: wosux-qr-scanner-apk
          path: app/build/outputs/apk/debug/*.apk
